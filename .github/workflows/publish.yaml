name: Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/c4g/va-springboard

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test the published image
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_PW: smoke
          DATABASE_USER: smoke
          DATABASE_NAME: smoke
          DATABASE_PORT: ''
          APP_PORT: ''
          AUTH_SECRET: smoke-only-not-a-real-secret-value
          AUTH_GOOGLE_ID: ''
          AUTH_GOOGLE_SECRET: ''
          AUTH_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
        run: |
          docker compose -f docker-compose.yml --profile production -p smoke up -d --pull always

          app=$(docker compose -p smoke ps -q --all va-springboard-app)
          migration=$(docker compose -p smoke ps -q --all va-springboard-migrations)
          backup=$(docker compose -p smoke ps -q --all va-springboard-backup)

          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$app")
            echo "attempt $i: $status"
            case "$status" in healthy|unhealthy) break ;; esac
            sleep 2
          done

          test "$(docker inspect -f '{{.State.ExitCode}}' "$backup")" = 0
          docker compose -p smoke logs va-springboard-backup | grep -q "Backup complete"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$migration")" = 0
          test "$(docker inspect -f '{{.State.Health.Status}}' "$app")" = healthy

      - name: Stop smoke test stack
        if: always()
        run: docker compose -f docker-compose.yml --profile production -p smoke down --volumes --remove-orphans || true

      - name: Deploy staging in Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

      - name: Deployment summary
        run: |
          echo "Published ${IMAGE}:${GITHUB_SHA} and ${IMAGE}:latest." >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered the staging deployment. Production remains manual." >> "$GITHUB_STEP_SUMMARY"
