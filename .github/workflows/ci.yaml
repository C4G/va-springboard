name: Validate VA Springboard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and smoke test the production stack
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DATABASE_PW: smoke
          DATABASE_USER: smoke
          DATABASE_NAME: smoke
          DATABASE_PORT: ''
          APP_PORT: ''
          AUTH_SECRET: smoke-only-not-a-real-secret-value
          AUTH_GOOGLE_ID: ''
          AUTH_GOOGLE_SECRET: ''
          AUTH_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
        run: |
          project="va-springboard-pr-${PR_NUMBER}"
          docker compose -f docker-compose.yml -f docker-compose.build.yml --profile production -p "$project" up --build -d

          app=$(docker compose -p "$project" ps -q --all va-springboard-app)
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$app")
            echo "attempt $i: $status"
            case "$status" in healthy|unhealthy) break ;; esac
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' "$app")" != healthy ]; then
            docker compose -p "$project" logs
            exit 1
          fi

      - name: Clean up
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml --profile production -p "va-springboard-pr-${PR_NUMBER}" down --volumes --remove-orphans || true
